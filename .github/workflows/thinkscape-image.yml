name: Build Thinkscape fork image

# The fork's own image (device-sync additions), published to the fork owner's GHCR.
on:
  push:
    tags:
      - "*-thinkscape.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (defaults to the ref name)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: thinkscape-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner != 'rommapp'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/romm
      IMAGE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalise image name and tag
        run: |
          # GHCR repository names must be lowercase; tags may not contain '/'.
          echo "IMAGE=${IMAGE,,}" >>"$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG//\//-}" >>"$GITHUB_ENV"

      - name: Set version
        run: sed -i "s/<version>/${IMAGE_TAG}/" backend/__version__.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ScreenScraper only answers builds that carry RomM's developer credentials,
      # which upstream bakes into every public image as ENV. Reuse the values from
      # the upstream release this fork is based on (fork secrets win if set).
      - name: Read ScreenScraper build args from the upstream image
        env:
          UPSTREAM_IMAGE: rommapp/romm:5.4.0
          FORK_SS_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          FORK_SS_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          docker pull -q "$UPSTREAM_IMAGE" >/dev/null
          env_of() { docker image inspect "$UPSTREAM_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n "s/^$1=//p"; }
          SS_ID="${FORK_SS_ID:-$(env_of SCREENSCRAPER_DEV_ID)}"
          SS_PASSWORD="${FORK_SS_PASSWORD:-$(env_of SCREENSCRAPER_DEV_PASSWORD)}"
          if [ -z "$SS_ID" ] || [ -z "$SS_PASSWORD" ]; then
            echo "::error::No ScreenScraper developer credentials found"; exit 1
          fi
          echo "::add-mask::$SS_ID"
          echo "::add-mask::$SS_PASSWORD"
          { echo "SS_DEV_ID=$SS_ID"; echo "SS_DEV_PASSWORD=$SS_PASSWORD"; } >>"$GITHUB_ENV"

      - name: Build and push full image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: docker/Dockerfile
          context: .
          platforms: linux/amd64
          target: full-image
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.title=romm
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SCREENSCRAPER_DEV_ID=${{ env.SS_DEV_ID }}
            SCREENSCRAPER_DEV_PASSWORD=${{ env.SS_DEV_PASSWORD }}
